<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>for Adia</title>
  <meta name="description" content="i'll always be waiting my dear Adia">
  <meta property="og:title" content="for Adia">
  <meta property="og:description" content="i'll always be waiting my dear Adia">
  <meta property="og:image" content="https://jstnxngg.github.io/for-adia/poster.png">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#241826">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #241826;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px 16px;
    }
    .scene {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      display: block;
      background: #241826 url(poster.png) center / cover no-repeat;
      image-rendering: pixelated;
      border: 4px solid #d6829c;
      box-shadow: 0 0 0 4px #603a5c, 0 12px 40px rgba(0, 0, 0, .5);
    }
    .label {
      width: min(100%, 432px);
      height: auto;
      image-rendering: pixelated;
    }
    .song {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <video class="scene" src="waiting.mp4" poster="poster.png" autoplay muted loop playsinline
         aria-label="A wet golden retriever puppy waits under the porch roof of a strawberry cottage while it rains. The caption says: i'll always be waiting my dear Adia."></video>
  <img class="label" src="label.png" alt="tap play for our song">
  <iframe class="song" src="https://www.youtube.com/embed/Qw20tg1v7Fc?loop=1&amp;playlist=Qw20tg1v7Fc&amp;rel=0&amp;playsinline=1"
          title="Steve Lacy - the feeling" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
</body>
</html>
